<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Admin — Young Événement 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { padding-top: 5rem; }
    .admin-controls { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .admin-controls input, .admin-controls select { background: var(--dark2); border: 1px solid var(--border); color: #fff; padding: 0.6rem 1rem; outline: none; }
    .admin-stats { display: flex; gap: 2rem; margin-bottom: 2rem; background: var(--glass2); padding: 1.5rem; border: 1px solid var(--border); }
    .admin-stat-item b { color: var(--gold); font-size: 1.2rem; }
  </style>
</head>
<body>

  <div id="progress" class="progress"></div>
  <div id="toast" class="toast"></div>

  <nav id="navbar">
    <a href="index.html" class="nav-logo">ESPACE ADMIS</a>
    <div class="nav-links">
      <a href="index.html">Retour au site</a>
    </div>
  </nav>

  <main style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
    <div class="section-label">Gestion</div>
    <h1 class="section-title">Coin Admin</h1>
    <div class="section-line"></div>

    <div class="admin-stats">
      <div class="admin-stat-item">Total inscrits : <b id="totalCount">0</b></div>
      <div class="admin-stat-item">Établissements : <b id="totalSchools">0</b></div>
      <button class="btn btn-ghost" onclick="exportCSV()" style="margin-left: auto; padding: 0.5rem 1rem;">Exporter CSV</button>
    </div>

    <div class="admin-controls">
      <input type="text" id="searchInput" placeholder="Rechercher un nom..." oninput="renderAdminTable()">
      <select id="filterClasse" onchange="renderAdminTable()">
        <option value="">Toutes les classes</option>
        <option value="Seconde">Seconde</option>
        <option value="Première">Première</option>
        <option value="Terminale">Terminale</option>
        <option value="Université">Université</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom Complet</th>
            <th>Classe</th>
            <th>Établissement</th>
            <th>Téléphone</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="database.js"></script>
  <script src="main.js"></script>
  <script>
    async function renderAdminTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const fClasse = document.getElementById('filterClasse').value;
      let data = await DB.load();

      if (search) data = data.filter(e => (e.prenom + ' ' + e.nom).toLowerCase().includes(search));
      if (fClasse) data = data.filter(e => e.classe === fClasse);

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = data.map((e, i) => `
        <tr>
          <td style="font-size:0.7rem; color:var(--muted)">${i+1}</td>
          <td style="font-weight:600;">${e.prenom} ${e.nom}</td>
          <td>${e.classe}</td>
          <td>${e.lycee}</td>
          <td>${e.tel}</td>
          <td><span class="badge badge-${e.auth === 'confirmé' ? 'confirm' : 'attente'}">${e.auth}</span></td>
          <td>${e.date}</td>
          <td><button class="btn" style="color:#ef4444; padding:0;" onclick="deleteEntry('${e.id}')">🗑</button></td>
        </tr>
      `).join('');

      document.getElementById('totalCount').textContent = await DB.count();
      document.getElementById('totalSchools').textContent = await DB.etablissements();
    }

    async function deleteEntry(id) {
      if(confirm("Confirmer la suppression ?")) {
        try {
          await DB.remove(id);
          renderAdminTable();
          toast("Inscrit retiré", "error");
        } catch (e) {
          toast("Erreur lors de la suppression", "error");
        }
      }
    }

    async function exportCSV() {
      const data = await DB.load();
      if (!data.length) return toast('Aucune donnée', 'error');
      const header = 'Prénom,Nom,Classe,Lycée,Tel,Auth,Date';
      const rows = data.map(e => `${e.prenom},${e.nom},${e.classe},${e.lycee},${e.tel},${e.auth},${e.date}`);
      const csv = [header, ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'inscrits_2026.csv');
      a.click();
    }

    document.addEventListener('DOMContentLoaded', renderAdminTable);
  </script>
</body>
</html>
